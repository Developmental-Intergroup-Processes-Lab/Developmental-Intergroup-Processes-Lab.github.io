{% assign people = site.teaching | sort: "rank" %}
{% for person in people %}
  <div style="margin-bottom: 40px; overflow: auto;">
    <h2>{{ person.title }}</h2>
    <p><em>{{ person.type }}, {{ person.venue }}</em></p>
    {{ person.content | markdownify }}
  </div>
{% endfor %}
